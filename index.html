<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Administrativo - RV SaaS</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: #020617;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: white;
            margin: 0;
        }
        .login-box {
            background: rgba(15, 23, 42, 0.95);
            padding: 40px;
            border-radius: 25px;
            border: 1px solid rgba(34, 197, 94, 0.3);
            width: 90%;
            max-width: 400px;
            text-align: center;
            backdrop-filter: blur(15px);
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.6);
            z-index: 2;
        }
        h2 {
            font-size: 28px;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 15px;
            margin: 12px 0;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: #020617;
            color: white;
            box-sizing: border-box;
            font-size: 16px;
        }
        input:focus {
            border-color: #22c55e;
            outline: none;
        }
        button {
            width: 100%;
            border: none;
            background: linear-gradient(90deg, #22c55e, #16a34a);
            color: white;
            padding: 15px;
            border-radius: 15px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: .3s;
            box-shadow: 0 0 25px rgba(34, 197, 94, 0.35);
            margin-top: 15px;
        }
        button:hover {
            transform: scale(1.02);
        }
        button:disabled {
            opacity: .7;
            cursor: not-allowed;
            transform: none;
        }
        #status {
            text-align: center;
            margin-top: 20px;
            color: #cbd5e1;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="bg"></div>
    <div class="login-box">
        <div class="tag" style="display:inline-block; padding:8px 15px; border-radius:50px; background: rgba(34,197,94,.15); color:#22c55e; font-size:12px; margin-bottom:15px; font-weight:bold;">ÁREA RESTRITA</div>
        <h2>Acesso Empresa</h2>
        <input type="email" id="email" placeholder="E-mail da Empresa">
        <input type="password" id="pass" placeholder="Senha de Acesso">
        <button id="btnLogin">ENTRAR NO PAINEL</button>
        <div id="status">Introduza as suas credenciais para aceder.</div>
    </div>
    <script type="module" src="auth.js"></script>
</body>
</html>
